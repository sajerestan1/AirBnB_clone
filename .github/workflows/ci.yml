name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python files
        run: python -m compileall -q console.py models tests
      - name: Run existing unittest suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python formatting and common errors (advisory)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check console.py models tests --output-format github
